[project]
name = "geoapps"
version = "0.0.1"
description = "Workspace root for the geoapps platform (see docs/design)."
requires-python = ">=3.11"
dependencies = [
    "geoapps-core",
    "geoapps-db",
    "geoapps-api",
    "geoapps-workers",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
geoapps-core = { workspace = true }
geoapps-db = { workspace = true }
geoapps-api = { workspace = true }
geoapps-workers = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# shape and equation comments sit right of the code, as the design conventions ask
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["geoapps_core", "geoapps_db", "geoapps_api", "geoapps_workers"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
