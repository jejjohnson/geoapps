[project]
name = "geoapps-db"
version = "0.0.1"
description = "The only code that writes to the geoapps database: SQLAlchemy models, queries and Alembic migrations."
requires-python = ">=3.11"
dependencies = [
    "geoapps-core",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "shapely>=2.0",
]

[project.scripts]
geoapps-db = "geoapps_db.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoapps_db"]
