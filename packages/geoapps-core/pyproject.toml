[project]
name = "geoapps-core"
version = "0.0.1"
description = "Kind-agnostic domain rules for geoapps: event kinds, statuses, priority, persistence, attribution scores."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoapps_core"]
