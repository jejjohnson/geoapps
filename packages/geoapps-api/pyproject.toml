[project]
name = "geoapps-api"
version = "0.0.1"
description = "HTTP contract for geoapps: FastAPI over geoapps-db. Never imports GeoStack."
requires-python = ">=3.11"
dependencies = [
    "geoapps-core",
    "geoapps-db",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jsonschema>=4.22",
    "pystac-client>=0.8",
]

[project.scripts]
geoapps-api = "geoapps_api.main:serve"
geoapps-openapi = "geoapps_api.main:dump_openapi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoapps_api"]
